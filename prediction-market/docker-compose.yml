# ========================================================
# PREDICTION MARKET - FAST FOOD MVP
# Docker Compose para Infraestrutura Completa
# ========================================================

version: '3.8'

services:
  # Banco de Dados PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: prediction-market-db
    environment:
      POSTGRES_DB: varedb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API FastAPI Backend
  api:
    build: .
    container_name: prediction-market-api
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: varedb
      DB_USER: postgres
      DB_PASSWORD: root
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Scraper Worker (executa periodicamente)
  scraper:
    build: .
    container_name: prediction-market-scraper
    command: python scraper.py
    volumes:
      - .:/app
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: varedb
      DB_USER: postgres
      DB_PASSWORD: root
    depends_on:
      - postgres
      - api
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
