# Render.yaml - Configuração para deploy no Render
services:
  # Serviço principal - Dashboard Streamlit
  - type: web
    name: sinaispointer-dashboard
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run loterias_dashboard.py --server.port=$PORT --server.address=0.0.0.0
    envVars:
      - key: PORT
        value: 8501
